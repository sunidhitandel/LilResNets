# HybridResNet: 4.92M parameters
# Mixed convolution sizes with targeted regularization for CIFAR-10
model_name: "DeepSlim"
num_blocks: [4, 6, 3]
conv_types: ['2x2', '3x3', '1x1']
shortcut_types: ['1x1', '2x2', '1x1']
num_channels: 64
avg_pool_kernel_size: 4
drop: 0.15
squeeze_and_excitation: true
se_reduction: 8
use_bottleneck: true
grad_clip: 0.2
max_epochs: 200
optim: "sgd"
lr_sched: "CosineAnnealingLR"
momentum: 0.9
lr: 0.05
weight_decay: 0.0005
batch_size: 128
num_workers: 16
data_augmentation: 1
data_normalize: 1
lookahead: 1
label_smoothing: 0.1
use_amp: true
early_stopping_patience: 15
min_delta: 0.001