# HybridResNet: 4.92M parameters
# Mixed convolution sizes with targeted regularization for CIFAR-10
model_name: "MyResNet"
num_blocks: [6, 5, 3]
conv_kernel_sizes: [3, 3, 3]
shortcut_kernel_sizes: [1, 1, 1]
num_channels: 64
avg_pool_kernel_size: 8
drop: 0.1
squeeze_and_excitation: 1
grad_clip: 0.15
max_epochs: 200
optim: "sgd"
lr_sched: "CosineAnnealingLR"
momentum: 0.9
lr: 0.09
weight_decay: 0.001
batch_size: 256
num_workers: 16
data_augmentation: 1
data_normalize: 1
lookahead: 1
label_smoothing: 0.15
use_amp: false
early_stopping_patience: 40
min_delta : 0.0009

