model_name: "MyResNet"
num_blocks: [4, 4, 3]
conv_kernel_sizes: [3, 3, 3]
shortcut_kernel_sizes: [1, 1, 1]
num_channels: 64
avg_pool_kernel_size: 8
drop: 0
squeeze_and_excitation: 1
grad_clip: 0.1
max_epochs: 200
optim: "sgd"
lr_sched: "CosineAnnealingLR"
momentum: 0.9
lr: 0.1
weight_decay: 0.0005
batch_size: 256
num_workers: 16
data_augmentation: 1
data_normalize: 1
lookahead: 1
label_smoothing: 0.1
use_amp: true
early_stopping_patience: 20
min_delta : 0.0009